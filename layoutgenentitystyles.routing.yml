layoutgenentitystyles.generate:
  path: '/admin/config/system/layoutgenentitystyles/manuel/generate'
  defaults:
    _title: 'Add scss import to theme'
    _controller: '\Drupal\layoutgenentitystyles\Controller\LayoutgenentitystylesController::ManuelGenerate'
  requirements:
    _permission: 'rebuild layoutgenentitystyles'

layoutgenentitystyles.generate.by.entities:
  path: '/admin/config/system/layoutgenentitystyles/manuel/generate-by-entities'
  defaults:
    _title: 'Add scss import to theme'
    _controller: '\Drupal\layoutgenentitystyles\Controller\LayoutgenentitystylesController::ManuelGenerateByEntities'
  requirements:
    _permission: 'rebuild layoutgenentitystyles'

layoutgenentitystyles.generate.individual.entity:
  path: '/admin/config/system/layoutgenentitystyles/manuel/generate-individual-entity/{entity_type_id}/{entity_id}'
  defaults:
    _title: 'Generate style for the page'
    _controller: '\Drupal\layoutgenentitystyles\Controller\LayoutgenentitystylesController::ManuelGenerateIndividualEntity'
  requirements:
    _permission: 'rebuild layoutgenentitystyles'
    
layoutgenentitystyles.generate.all:
  path: '/admin/config/system/layoutgenentitystyles/manuel/generate-all'
  defaults:
    _title: 'Add scss import to theme'
    _controller: '\Drupal\layoutgenentitystyles\Controller\LayoutgenentitystylesController::ManuelGenerateAll'
  requirements:
    _permission: 'rebuild layoutgenentitystyles with BD styles'

layoutgenentitystyles.settings_form:
  path: '/admin/config/system/layoutgenentitystyles/config1'
  defaults:
    _title: 'layout generate entity styles settings'
    _form: 'Drupal\layoutgenentitystyles\Form\SettingsForm'
  requirements:
    _permission: 'administer layoutgenentitystyles configuration'

