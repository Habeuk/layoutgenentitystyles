services:
  layoutgenentitystyles.loadstyle:
    class: Drupal\layoutgenentitystyles\Services\LoadStyleFromMod
    arguments: ['@extension.path.resolver','@messenger']
  layoutgenentitystyles.add.style.theme:
    class: Drupal\layoutgenentitystyles\Services\LayoutgenentitystylesServices
    arguments: ['@plugin.manager.layout_builder.section_storage','@layoutgenentitystyles.loadstyle','@config.factory','@generate_style_theme.manage_file_custom_style','@generate_style_theme.manage_file_mail_style']
  layoutgenentitystyles.add.styles.by.entities:
    class: Drupal\layoutgenentitystyles\Services\BuildStylesByEntities
    arguments: ['@plugin.manager.layout_builder.section_storage','@layoutgenentitystyles.loadstyle','@config.factory','@generate_style_theme.manage_file_custom_style','@generate_style_theme.manage_file_mail_style']
  layoutgenentitystyles.paragraph_loader:
    class: Drupal\layoutgenentitystyles\Services\ParagraphLoader
    arguments: ['@entity_type.manager', '@entity_field.manager']
